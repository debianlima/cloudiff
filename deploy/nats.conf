server_name: cloudiff-v2-hospedagem
port: 4222
http_port: 8222
max_payload: 16777216
write_deadline: "10s"
include ./nats-users.conf
tls {
  cert_file: "/etc/nats/tls/server/fullchain.pem"
  key_file: "/etc/nats/tls/server/privkey.pem"
  ca_file: "/etc/nats/tls/client-ca/ca-chain.pem"
  verify: true
  timeout: 3
}
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 64MB
  max_file_store: 2GB
}
