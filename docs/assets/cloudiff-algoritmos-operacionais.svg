<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Algoritmos operacionais da CloudIFF</title>
  <desc id="desc">Diagrama dos fluxos de provisionamento, publicação, agentes MCP e reconciliação da plataforma CloudIFF.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#12843a"/>
    </marker>
  </defs>

  <rect width="1600" height="1120" fill="#ffffff"/>

  <text x="80" y="82" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700" fill="#111512">Algoritmos operacionais da CloudIFF</text>
  <text x="80" y="128" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="400" fill="#5b635d">Do código na raiz à publicação dN, com acessos reconciliados, auditoria e rollback.</text>

  <!-- Provisionamento -->
  <rect x="80" y="180" width="1440" height="190" rx="22" fill="#f7f9f7" stroke="#d9dedb" stroke-width="2"/>
  <rect x="80" y="180" width="12" height="190" rx="6" fill="#12843a"/>
  <text x="120" y="230" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#12843a">01</text>
  <text x="120" y="266" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111512">Provisionamento</text>
  <text x="120" y="298" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5b635d">Cria um projeto isolado</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="350" y="228" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="435" y="266" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Solicitação</text>
    <text x="435" y="292" text-anchor="middle" font-size="15" fill="#5b635d">wizard do portal</text>

    <line x1="522" y1="275" x2="548" y2="275" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="558" y="228" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="643" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Validar</text>
    <text x="643" y="286" text-anchor="middle" font-size="15" fill="#5b635d">permissões + lock</text>

    <line x1="730" y1="275" x2="756" y2="275" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="766" y="228" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="851" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Forgejo</text>
    <text x="851" y="286" text-anchor="middle" font-size="15" fill="#5b635d">código na raiz</text>

    <line x1="938" y1="275" x2="964" y2="275" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="974" y="228" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="1059" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Komodo</text>
    <text x="1059" y="286" text-anchor="middle" font-size="15" fill="#5b635d">container próprio d1</text>

    <line x1="1146" y1="275" x2="1172" y2="275" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1182" y="228" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="1267" y="260" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Supabase</text>
    <text x="1267" y="286" text-anchor="middle" font-size="15" fill="#5b635d">tenant + serviços</text>

    <line x1="1354" y1="275" x2="1380" y2="275" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1390" y="228" width="90" height="94" rx="14" fill="#12843a"/>
    <text x="1435" y="260" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Publicar</text>
    <text x="1435" y="286" text-anchor="middle" font-size="14" fill="#e9f5ed">HTTP 200</text>
  </g>

  <!-- Publicação -->
  <rect x="80" y="400" width="1440" height="190" rx="22" fill="#f7f9f7" stroke="#d9dedb" stroke-width="2"/>
  <rect x="80" y="400" width="12" height="190" rx="6" fill="#12843a"/>
  <text x="120" y="450" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#12843a">02</text>
  <text x="120" y="486" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111512">Publicação</text>
  <text x="120" y="518" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5b635d">Uma stack e container por dN</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="350" y="448" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="435" y="480" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Git push</text>
    <text x="435" y="506" text-anchor="middle" font-size="15" fill="#5b635d">HTTPS + webhook</text>

    <line x1="522" y1="495" x2="548" y2="495" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="558" y="448" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="643" y="480" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Build</text>
    <text x="643" y="506" text-anchor="middle" font-size="15" fill="#5b635d">imagem própria dN</text>

    <line x1="730" y1="495" x2="756" y2="495" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="766" y="448" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="851" y="480" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Healthcheck</text>
    <text x="851" y="506" text-anchor="middle" font-size="15" fill="#5b635d">container dN saudável</text>

    <line x1="938" y1="495" x2="964" y2="495" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="974" y="448" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="1059" y="480" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Preview</text>
    <text x="1059" y="506" text-anchor="middle" font-size="15" fill="#5b635d">URL própria da dN</text>

    <line x1="1146" y1="495" x2="1172" y2="495" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1182" y="448" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="1267" y="480" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Aprovar</text>
    <text x="1267" y="506" text-anchor="middle" font-size="15" fill="#5b635d">decisão humana</text>

    <line x1="1354" y1="495" x2="1380" y2="495" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1390" y="448" width="90" height="94" rx="14" fill="#12843a"/>
    <text x="1435" y="480" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Promover</text>
    <text x="1435" y="506" text-anchor="middle" font-size="13" fill="#e9f5ed">alias ou rollback</text>
  </g>

  <!-- Agentes MCP -->
  <rect x="80" y="620" width="1440" height="190" rx="22" fill="#f7f9f7" stroke="#d9dedb" stroke-width="2"/>
  <rect x="80" y="620" width="12" height="190" rx="6" fill="#12843a"/>
  <text x="120" y="670" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#12843a">03</text>
  <text x="120" y="706" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111512">Agentes MCP</text>
  <text x="120" y="738" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5b635d">Ferramentas com escopo e auditoria</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="350" y="668" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="435" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">OAuth 2.1</text>
    <text x="435" y="726" text-anchor="middle" font-size="15" fill="#5b635d">PKCE + identidade</text>

    <line x1="522" y1="715" x2="548" y2="715" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="558" y="668" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="643" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">MCP Gateway</text>
    <text x="643" y="726" text-anchor="middle" font-size="15" fill="#5b635d">descobre ferramentas</text>

    <line x1="730" y1="715" x2="756" y2="715" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="766" y="668" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="851" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Escopos</text>
    <text x="851" y="726" text-anchor="middle" font-size="15" fill="#5b635d">ACL por projeto</text>

    <line x1="938" y1="715" x2="964" y2="715" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="974" y="668" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="1059" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Política</text>
    <text x="1059" y="726" text-anchor="middle" font-size="15" fill="#5b635d">validação server-side</text>

    <line x1="1146" y1="715" x2="1172" y2="715" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1182" y="668" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="1267" y="700" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Aprovação</text>
    <text x="1267" y="726" text-anchor="middle" font-size="15" fill="#5b635d">quando protegida</text>

    <line x1="1354" y1="715" x2="1380" y2="715" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1390" y="668" width="90" height="94" rx="14" fill="#12843a"/>
    <text x="1435" y="700" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Executar</text>
    <text x="1435" y="726" text-anchor="middle" font-size="13" fill="#e9f5ed">+ auditar</text>
  </g>

  <!-- Reconciliação -->
  <rect x="80" y="840" width="1440" height="190" rx="22" fill="#f7f9f7" stroke="#d9dedb" stroke-width="2"/>
  <rect x="80" y="840" width="12" height="190" rx="6" fill="#12843a"/>
  <text x="120" y="890" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#12843a">04</text>
  <text x="120" y="926" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#111512">Reconciliação</text>
  <text x="120" y="958" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5b635d">Membros, runtime e acessos convergentes</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="350" y="888" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="435" y="920" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Desejado</text>
    <text x="435" y="946" text-anchor="middle" font-size="15" fill="#5b635d">ACL projeto e banco</text>

    <line x1="522" y1="935" x2="548" y2="935" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="558" y="888" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="643" y="920" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Observar</text>
    <text x="643" y="946" text-anchor="middle" font-size="15" fill="#5b635d">estado real</text>

    <line x1="730" y1="935" x2="756" y2="935" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="766" y="888" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="851" y="920" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Comparar</text>
    <text x="851" y="946" text-anchor="middle" font-size="15" fill="#5b635d">detectar divergência</text>

    <line x1="938" y1="935" x2="964" y2="935" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="974" y="888" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="1059" y="920" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Planejar</text>
    <text x="1059" y="946" text-anchor="middle" font-size="15" fill="#5b635d">efeitos controlados</text>

    <line x1="1146" y1="935" x2="1172" y2="935" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1182" y="888" width="170" height="94" rx="14" fill="#ffffff" stroke="#cfd6d1" stroke-width="2"/>
    <text x="1267" y="920" text-anchor="middle" font-size="18" font-weight="700" fill="#111512">Aplicar</text>
    <text x="1267" y="946" text-anchor="middle" font-size="15" fill="#5b635d">Forgejo + Komodo + DB</text>

    <line x1="1354" y1="935" x2="1380" y2="935" stroke="#12843a" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1390" y="888" width="90" height="94" rx="14" fill="#12843a"/>
    <text x="1435" y="920" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Registrar</text>
    <text x="1435" y="946" text-anchor="middle" font-size="13" fill="#e9f5ed">resultado</text>
  </g>

  <text x="80" y="1080" font-family="Inter, Arial, sans-serif" font-size="17" fill="#5b635d">CloudIFF · fluxos resumidos; detalhes e contratos completos estão no manual técnico do repositório.</text>
</svg>
