<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de publicação W → H → P da CloudIFF</title>
  <desc id="desc">Preview W é um workspace vivo, Homologação H congela código e runtime, e Publicação P promove exatamente o mesmo artefato homologado sem rebuild.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#168821"/>
    </marker>
  </defs>
  <rect width="1400" height="620" fill="#ffffff"/>
  <text x="90" y="86" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#102118">Preview → Homologação → Publicação</text>
  <text x="90" y="126" font-family="Inter, Arial, sans-serif" font-size="20" fill="#668073">Um único fluxo, do workspace vivo ao artefato aprovado em Produção.</text>

  <g transform="translate(90 190)">
    <rect width="340" height="280" rx="20" fill="#f5f8f6" stroke="#d6e2da" stroke-width="2"/>
    <circle cx="54" cy="54" r="30" fill="#e8f6ea"/>
    <text x="54" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#168821">W</text>
    <text x="98" y="50" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#102118">Preview vivo</text>
    <text x="98" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#668073">Workspace de desenvolvimento</text>
    <text x="28" y="132" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Git local montado no container</text>
    <text x="28" y="168" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Alterações aparecem imediatamente</text>
    <text x="28" y="204" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Terminal trabalha no próprio W</text>
    <text x="28" y="240" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Git remoto pode degradar sem derrubar W</text>
  </g>

  <line x1="450" y1="330" x2="525" y2="330" stroke="#168821" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="488" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#168821">CONGELAR</text>

  <g transform="translate(535 190)">
    <rect width="340" height="280" rx="20" fill="#f5f8f6" stroke="#d6e2da" stroke-width="2"/>
    <circle cx="54" cy="54" r="30" fill="#e8f6ea"/>
    <text x="54" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#168821">H</text>
    <text x="98" y="50" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#102118">Homologação</text>
    <text x="98" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#668073">Candidato imutável</text>
    <text x="28" y="132" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Snapshot de código + runtime</text>
    <text x="28" y="168" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Diff de código e de runtime</text>
    <text x="28" y="204" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Homologadores autorizados</text>
    <text x="28" y="240" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Digest fixo para a promoção</text>
  </g>

  <line x1="895" y1="330" x2="970" y2="330" stroke="#168821" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="932" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#168821">APROVAR</text>

  <g transform="translate(980 190)">
    <rect width="340" height="280" rx="20" fill="#f5f8f6" stroke="#d6e2da" stroke-width="2"/>
    <circle cx="54" cy="54" r="30" fill="#e8f6ea"/>
    <text x="54" y="64" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#168821">P</text>
    <text x="98" y="50" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#102118">Publicação</text>
    <text x="98" y="78" font-family="Inter, Arial, sans-serif" font-size="16" fill="#668073">Produção controlada</text>
    <text x="28" y="132" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Mesmo digest homologado</text>
    <text x="28" y="168" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Sem rebuild entre H e P</text>
    <text x="28" y="204" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Aprovação crítica de Produção</text>
    <text x="28" y="240" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3e594b">• Rollback entre releases P</text>
  </g>

  <rect x="90" y="510" width="1230" height="58" rx="16" fill="#102118"/>
  <text x="705" y="546" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">W muda continuamente · H congela · P publica exatamente o que foi homologado</text>
</svg>
