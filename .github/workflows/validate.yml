name: Validate CloudIFF source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML jsonschema cryptography
      - name: Validate source, security and Portal quality gates
        run: scripts/validate.sh
      - name: Run offline tests and parse existing production tests
        run: scripts/test.sh
      - name: Verify generated technical catalogs are current
        run: |
          python3 scripts/generate-technical-catalogs.py
          git diff --exit-code -- docs/CATALOGO-DE-AGENTES.md docs/CATALOGO-DE-ROTAS.md docs/CATALOGO-DE-SERVICOS.md docs/DICIONARIO-DE-DADOS-ESTATICO.md
