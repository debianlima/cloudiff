# CloudIF router v170 - subdomain tenants + legacy /supabase/<tenant>

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $host $cloudif_host_tenant {
    default "";
    ~^([A-Za-z0-9_.-]+)\.cloudiff\.duckdns\.org$ $1;
}

map $http_referer $cloudif_referer_tenant {
    default "";
    ~*/supabase/([^/]+)/ $1;
    ~^https?://([A-Za-z0-9_.-]+)\.cloudiff\.duckdns\.org/ $1;
}

map "$cloudif_host_tenant:$cookie_cloudif_tenant:$cloudif_referer_tenant" $cloudif_effective_tenant {
    default "";
    ~^([^:]+):.*:.*$ $1;
    ~^:([^:]+):.*$ $1;
    ~^::([^:]+)$ $1;
}

map $cloudif_host_tenant $cloudif_is_subdomain_tenant {
    default 1;
    "" 0;
}

map $cloudif_effective_tenant $cloudif_kong_port {
    default "";
    akadmin 8102;
    iff1742962 8101;
    aluno 8110;
    iff1860746 8111;
}

map $cloudif_effective_tenant $cloudif_basic_auth_header {
    default "";
    akadmin "Basic Y2xvdWRpZjo2M21VRFB0WjBONm1yN3Boc1E2NTFp";
    iff1742962 "Basic Y2xvdWRpZjptbHRiaWk4bHpURE9FUW8waUZFbjVO";
    aluno "Basic Y2xvdWRpZjpZVUVKVnBlQ0tld05UNDQyYWZxd3c1";
    iff1860746 "Basic Y2xvdWRpZjpjbDNjTGhKaEUxTGRHSzNnN3E2aktt";
}

server {
    listen 10.62.92.7:8099;
    server_name cloudiff.duckdns.org *.cloudiff.duckdns.org;

    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;
    proxy_headers_hash_max_size 4096;
    proxy_headers_hash_bucket_size 256;

    proxy_intercept_errors on;
    error_page 401 = @cloudif_reauth;

    location @cloudif_reauth {
        add_header Cache-Control no-store always;
        add_header X-CloudIF-Reason basic-auth-intercept always;
        return 302 https://cloudiff.duckdns.org/cloudiff/supabase/session/start;
    }


    # CloudIFF legacy public prefix compatibility BEGIN
    location = /cloudif { return 308 /cloudiff/; }
    location ^~ /cloudif/ {
        rewrite ^/cloudif/(.*)$ /cloudiff/$1 permanent;
    }
    # CloudIFF legacy public prefix compatibility END

    # CloudIF v244 authz locations BEGIN

    location = /cloudiff/authz {
        internal;
        proxy_pass http://10.62.92.7:18093/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-URL https://$http_host$request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 301 302 303 307 308 = @cloudif_authz_as_401_v244;
    }

    location @cloudif_authz_as_401_v244 {
        internal;
        return 401;
    }

    location ^~ /outpost.goauthentik.io/ {
        proxy_pass http://10.62.91.2:9000/outpost.goauthentik.io/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URL https://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @cloudif_authentik_signin_v244 {
        internal;
        return 302 /outpost.goauthentik.io/start?rd=https://$http_host$request_uri;
    }

    location @cloudif_forbidden_v244 {
        internal;
        default_type text/html;

        if ($cloudif_authz_reason = tenant-provisioning) {
            return 202 '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="5"><title>CloudIF preparando ambiente</title><style>body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui,Arial}.box{max-width:680px;margin:10vh auto;padding:28px}.card{background:#172033;border:1px solid #334155;border-radius:18px;padding:28px;box-shadow:0 20px 50px #0005}.bar{height:14px;background:#334155;border-radius:999px;overflow:hidden}.fill{height:100%;width:72%;background:linear-gradient(90deg,#22c55e,#38bdf8);animation:p 2s ease-in-out infinite alternate}@keyframes p{from{width:35%}to{width:88%}}.steps{line-height:1.9}.ok{color:#86efac}.wait{color:#7dd3fc}small{color:#94a3b8}</style></head><body><div class="box"><div class="card"><h2>CloudIF está preparando seu ambiente</h2><p>Estamos concluindo a configuração necessária para abrir este recurso.</p><div class="bar"><div class="fill"></div></div><div class="steps"><div class="ok">✓ Identidade reconhecida</div><div class="ok">✓ Permissões verificadas</div><div class="wait">● Inicializando serviços do tenant</div><div>○ Validando banco e API</div><div>○ Abrindo o ambiente</div></div><p><b>Tenant:</b> $cloudif_tenant<br><b>Ação:</b> $cloudif_provision_action<br><b>Status:</b> $cloudif_provision_message</p><small>A página atualiza automaticamente a cada 5 segundos. Caso permaneça nesta etapa por mais de dois minutos, volte ao Portal CloudIF e tente novamente.</small></div></div></body></html>';
        }

        return 403 'CloudIF: sessão autenticada, mas sem permissão para este tenant.<br>Tenant: $cloudif_tenant<br>Motivo: $cloudif_authz_reason<br>';
    }

    # CloudIF v244 authz locations END


    # CloudIF v250 root redirect BEGIN
    location = / {
        return 302 /cloudiff/portal/;
    }
    # CloudIF v250 root redirect END


    # CloudIF v256 router warmup BEGIN

    # Evita entregar HTML inicial do Supabase antes dos assets/API estarem estáveis.
    # Primeira passagem: define cookie curto e mostra tela leve.
    # Segunda passagem: libera o proxy normal.
    location @cloudif_router_warmup_v256 {
        internal;
        default_type text/html;
        add_header Set-Cookie "cloudif_router_warmup=1; Path=/; Max-Age=20; Secure; HttpOnly; SameSite=Lax" always;
        return 202 '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="5"><title>CloudIF carregando</title></head><body style="font-family:Arial,sans-serif;max-width:760px;margin:40px auto"><h2>CloudIF está carregando seu ambiente</h2><p>Aguarde 5 segundos. A página será atualizada automaticamente.</p><p>Se não abrir, pressione F5.</p></body></html>';
    }

    # CloudIF v256 router warmup END


    # CloudIF portal-auth v1 BEGIN
    location = /cloudiff/portal-auth {
        internal;
        proxy_pass http://10.62.91.2:9000/outpost.goauthentik.io/auth/nginx;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URL https://$http_host$request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_intercept_errors off;
    }
    # CloudIF portal-auth v1 END


    # CloudIF portal-specific forbidden BEGIN
    location @cloudif_portal_forbidden_v134 {
        internal;
        default_type text/html;
        add_header Cache-Control no-store always;
        return 403 '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso ao Portal</title></head><body style="font-family:system-ui,Arial;max-width:720px;margin:48px auto;padding:20px"><h1>Acesso ao Portal negado</h1><p>A sessão foi autenticada, mas a política do Portal recusou esta operação.</p><p>Atualize a página e tente novamente. Administradores CloudIF e professores têm acesso global.</p></body></html>';
    }
    # CloudIF portal-specific forbidden END

    # CloudIF portal v1 BEGIN
    location ^~ /cloudiff/portal/ {
        auth_request /cloudiff/portal-auth;
        error_page 401 = @cloudif_authentik_signin_v244;
        error_page 403 = @cloudif_portal_forbidden_v134;
        proxy_intercept_errors off;

        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;

        auth_request_set $authentik_username $upstream_http_x_authentik_username;
        auth_request_set $authentik_email $upstream_http_x_authentik_email;
        auth_request_set $authentik_groups $upstream_http_x_authentik_groups;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-authentik-username $authentik_username;
        proxy_set_header X-authentik-email $authentik_email;
        proxy_set_header X-authentik-groups $authentik_groups;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Preserve o prefixo público. O Portal usa /cloudiff/portal/ para selecionar o shell atual.
        proxy_pass http://10.62.92.7:18094;
    }
    # CloudIF portal v1 END

    # CloudIFF MCP + OAuth BEGIN
    location = /.well-known/oauth-authorization-server {
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:18198/.well-known/oauth-authorization-server;
