services:
  cloudif-tenant-router:
    image: nginx:stable-alpine
    container_name: cloudif-tenant-router
    network_mode: host
    restart: unless-stopped
    volumes:
      - /srv/cloudif/router/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/cloudif/router/mtls:/etc/nginx/mtls:ro
      - /srv/cloudif/router/logs:/var/log/nginx
