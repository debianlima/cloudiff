# CloudIFF canonical root redirect BEGIN
location = /cloudiff/ {
    return 302 /cloudiff/portal/;
}
# CloudIFF canonical root redirect END

# CloudIFF Forgejo OAuth subpath compatibility BEGIN
location ^~ /login/oauth/ {
    if ($host != cloudiff.duckdns.org) { return 404; }
    proxy_http_version 1.1;
    proxy_set_header Host cloudiff.duckdns.org;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Scheme https;
    proxy_set_header X-Forwarded-SSL on;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Host cloudiff.duckdns.org;
    proxy_set_header X-Forwarded-Prefix /git;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect off;
    proxy_pass http://10.62.91.2:3000;
}
# CloudIFF Forgejo OAuth subpath compatibility END
