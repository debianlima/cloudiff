# CloudIFF aluno TLS BEGIN
server {
    listen 80;
    listen [::]:80;
    server_name aluno.cloudiff.duckdns.org;
    include conf.d/include/letsencrypt-acme-challenge.conf;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aluno.cloudiff.duckdns.org;

    include conf.d/include/letsencrypt-acme-challenge.conf;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate /etc/letsencrypt/live/cloudif-aluno/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudif-aluno/privkey.pem;

    access_log /data/logs/aluno-cloudiff_access.log proxy;
    error_log /data/logs/aluno-cloudiff_error.log warn;
    include conf.d/include/block-exploits.conf;
    client_max_body_size 200m;

    location / {
        proxy_pass http://10.62.92.7:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
# CloudIFF aluno TLS END

# CloudIF machine administration dedicated subdomain
server {
    listen 80;
    listen [::]:80;
    server_name admin.cloudiff.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.cloudiff.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/cloudif-admin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudif-admin/privkey.pem;

    include conf.d/include/ssl-ciphers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = / {
        proxy_http_version 1.1;
        proxy_set_header Host admin.cloudiff.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host admin.cloudiff.duckdns.org;
        proxy_pass http://10.62.92.7:8099/cloudiff/portal/?tab=admin;
    }

    # CloudIF admin write proxy routes BEGIN
    location = /admin/policy/request {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host admin.cloudiff.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host admin.cloudiff.duckdns.org;
        proxy_pass http://10.62.92.7:8099/cloudiff/admin/machines/admin/policy/request;
    }
    location = /admin/requests/approve {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host admin.cloudiff.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host admin.cloudiff.duckdns.org;
        proxy_pass http://10.62.92.7:8099/cloudiff/admin/machines/admin/requests/approve;
    }
    location = /admin/alerts/ack {
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_set_header Host admin.cloudiff.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host admin.cloudiff.duckdns.org;
        proxy_pass http://10.62.92.7:8099/cloudiff/admin/machines/admin/alerts/ack;
    }
    # CloudIF admin write proxy routes END

    location ^~ /cloudiff/admin/machines/ {
        proxy_http_version 1.1;
        proxy_set_header Host admin.cloudiff.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host admin.cloudiff.duckdns.org;
        proxy_pass http://10.62.92.7:8099;
    }

    location ^~ /outpost.goauthentik.io/ {
        proxy_http_version 1.1;
        proxy_set_header Host admin.cloudiff.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host admin.cloudiff.duckdns.org;
        proxy_pass http://10.62.92.7:8099;
    }

    location / {
        return 302 /;
    }
}

