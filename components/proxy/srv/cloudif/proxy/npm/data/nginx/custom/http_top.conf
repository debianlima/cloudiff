# CloudIFF Taiga privacy-safe access log: never record query strings or Referer.
log_format cloudif_taiga_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

map $uri $cloudif_taiga_cache_control {
    default "";
    /login "no-store";
}

# CloudIFF Taiga ACME BEGIN
# CloudIFF Taiga HTTPS ACTIVE
server {
    listen 80;
    listen [::]:80;
    server_name taiga.cloudiff.duckdns.org;
    access_log /data/logs/taiga_safe_access.log cloudif_taiga_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taiga.cloudiff.duckdns.org;
    access_log /data/logs/taiga_safe_access.log cloudif_taiga_safe;
    ssl_certificate /etc/letsencrypt/live/cloudif-taiga/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudif-taiga/privkey.pem;
    include conf.d/include/ssl-ciphers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://cloudiff.duckdns.org" always;
    add_header Cache-Control $cloudif_taiga_cache_control always;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://10.62.91.5:19000;
    }
}
# CloudIFF Taiga ACME END
