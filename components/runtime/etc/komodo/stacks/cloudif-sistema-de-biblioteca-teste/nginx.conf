server { listen 80; server_name _; root /usr/share/nginx/html; index index.html; location = /__cloudif_health { access_log off; default_type application/json; return 200 '{"ok":true,"project":"sistema-de-biblioteca-teste"}'; } location / { try_files $uri $uri/ /index.html; } add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; }
