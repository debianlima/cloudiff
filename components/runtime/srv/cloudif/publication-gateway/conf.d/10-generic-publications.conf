map $host $cloudif_backend {
    ~^(?<p>[0-9]+)-w(?<w>[0-9]+)-preview\.cloudiff\.duckdns\.org$ cloudif-p$p-w$w-preview-web;
    ~^(?<p>[0-9]+)-h(?<h>[0-9]+)-homologation\.cloudiff\.duckdns\.org$ cloudif-p$p-d$h-web;
    ~^(?<p>[0-9]+)-p(?<r>[0-9]+)-publication\.cloudiff\.duckdns\.org$ cloudif-p$p-p$r-publication-web;
    ~^(?<p>[0-9]+)-d(?<d>[0-9]+)\.cloudiff\.duckdns\.org$ cloudif-p$p-d$d-web;
    ~^(?<p>[0-9]+)\.cloudiff\.duckdns\.org$ cloudif-p$p-active-web;
    default "";
}
server {
    listen 80;
    server_name ~^[0-9]+(?:-(?:w[0-9]+-preview|h[0-9]+-homologation|p[0-9]+-publication|d[0-9]+))?\.cloudiff\.duckdns\.org$;
    resolver 127.0.0.11 ipv6=off valid=10s;
    location = /__cloudif_health {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true,"service":"cloudif-publication-gateway"}';
    }
    location / {
        if ($cloudif_backend = "") { return 404; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://$cloudif_backend:80;
    }
}
