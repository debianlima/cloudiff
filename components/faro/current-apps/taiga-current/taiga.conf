map $http_x_forwarded_proto $cloudif_scheme { default $http_x_forwarded_proto; "" $scheme; }
log_format taiga_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';
server {
  listen 80 default_server;
  access_log /dev/stdout taiga_safe;
  error_log /dev/stderr error;
  add_header Referrer-Policy "no-referrer" always;
  client_max_body_size 100M;
  charset utf-8;
  location = /conf.json {
    proxy_pass http://taiga-front/conf.json;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $cloudif_scheme;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
  }
  # Taiga has no PHP runtime. Reject PHP-like paths instead of forwarding them
  # to the SPA fallback, which would otherwise return index.html with HTTP 200.
  location ~* \.(?:php(?:[0-9]+)?|phtml|phar)(?:/|$) { return 404; }
  # Frontend documents must always revalidate after a release. Shared lab
  # workstations must never keep an old identity/session bootstrap indefinitely.
  location = / {
    proxy_pass http://taiga-front/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Scheme $cloudif_scheme;
    proxy_set_header X-Forwarded-Proto $cloudif_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }
  location = /index.html {
    proxy_pass http://taiga-front/index.html;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $cloudif_scheme;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }
  location = /plugins/cloudif-session-isolation.js {
    proxy_pass http://taiga-front/plugins/cloudif-session-isolation.js;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $cloudif_scheme;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }
  location / {
    proxy_pass http://taiga-front/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Scheme $cloudif_scheme;
    proxy_set_header X-Forwarded-Proto $cloudif_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }
  location /api/ { proxy_pass http://taiga-back:8000/api/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Scheme $cloudif_scheme; proxy_set_header X-Forwarded-Proto $cloudif_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /oidc/ { proxy_pass http://taiga-back:8000/oidc/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Scheme $cloudif_scheme; proxy_set_header X-Forwarded-Proto $cloudif_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; add_header Cache-Control "no-store, no-cache, must-revalidate" always; }
  # Entrada OIDC canônica para estação compartilhada: sempre elimina a sessão
  # Taiga anterior antes de iniciar uma nova autenticação no IdP.
  location = /entrar-cloudiff {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Set-Cookie "sessionid=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax" always;
    return 200 '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>CloudIFF · Taiga</title><script>(function(){try{localStorage.removeItem("token");localStorage.removeItem("refresh");localStorage.removeItem("userInfo");}catch(e){}try{sessionStorage.removeItem("token");sessionStorage.removeItem("refresh");sessionStorage.removeItem("userInfo");sessionStorage.removeItem("cloudif-auth-generation");}catch(e){}location.replace("/oidc/authenticate/?next=/");})();</script>';
  }
  # Entrada CloudIFF para estações compartilhadas.
  location ~ "^/cloudif-enter/([a-z0-9][a-z0-9-]{0,62})$" {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Set-Cookie "sessionid=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax" always;
    return 200 '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>CloudIFF · Taiga</title><script>(function(){try{localStorage.removeItem("token");localStorage.removeItem("refresh");localStorage.removeItem("userInfo");}catch(e){}try{sessionStorage.removeItem("token");sessionStorage.removeItem("refresh");sessionStorage.removeItem("userInfo");sessionStorage.removeItem("cloudif-auth-generation");}catch(e){}location.replace("/oidc/authenticate/?next=/project/$1");})();</script>';
  }
  location /admin/ { proxy_pass http://taiga-back:8000/admin/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Scheme $cloudif_scheme; proxy_set_header X-Forwarded-Proto $cloudif_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /static/ { alias /taiga/static/; }
  location /_protected/ { internal; alias /taiga/media/; add_header Content-disposition "attachment"; add_header Cache-Control "private, no-store, no-cache, must-revalidate" always; add_header Pragma "no-cache" always; add_header Expires "0" always; }
  location /media/exports/ { alias /taiga/media/exports/; add_header Content-disposition "attachment"; add_header Cache-Control "private, no-store, no-cache, must-revalidate" always; add_header Pragma "no-cache" always; add_header Expires "0" always; }
  location /media/ { proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Scheme $cloudif_scheme; proxy_set_header X-Forwarded-Proto $cloudif_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass http://taiga-protected:8003/; add_header Cache-Control "private, no-store, no-cache, must-revalidate" always; add_header Pragma "no-cache" always; add_header Expires "0" always; add_header Vary "Authorization, Cookie" always; }
  location /events { proxy_pass http://taiga-events:8888/events; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_connect_timeout 7d; proxy_send_timeout 7d; proxy_read_timeout 7d; }
}
