map $http_x_forwarded_proto $cloudif_scheme { default $http_x_forwarded_proto; "" $scheme; }
log_format taiga_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';
server {
  listen 80 default_server;
  access_log /dev/stdout taiga_safe;
  error_log /dev/stderr error;
  add_header Referrer-Policy "no-referrer" always;
  client_max_body_size 100M;
  charset utf-8;
  location = /conf.json {
    proxy_pass http://taiga-front/conf.json;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $cloudif_scheme;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires off;
  }
  location / { proxy_pass http://taiga-front/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Scheme $cloudif_scheme; proxy_set_header X-Forwarded-Proto $cloudif_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/ { proxy_pass http://taiga-back:8000/api/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Scheme $cloudif_scheme; proxy_set_header X-Forwarded-Proto $cloudif_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /oidc/ { proxy_pass http://taiga-back:8000/oidc/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Scheme $cloudif_scheme; proxy_set_header X-Forwarded-Proto $cloudif_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  # Entrada OIDC canônica: ignora query externa e fixa retorno seguro na raiz.
  location = /entrar-cloudiff {
    return 302 https://$host/oidc/authenticate/?next=/;
  }
  # Entrada CloudIFF para estações compartilhadas.
  location ~ "^/cloudif-enter/([a-z0-9][a-z0-9-]{0,62})$" {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Set-Cookie "sessionid=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax" always;
    return 200 '<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>CloudIFF · Taiga</title><script>(function(){try{localStorage.removeItem("token");localStorage.removeItem("refresh");localStorage.removeItem("userInfo");}catch(e){}try{sessionStorage.removeItem("token");sessionStorage.removeItem("refresh");sessionStorage.removeItem("userInfo");}catch(e){}location.replace("/oidc/authenticate/?next=/project/$1");})();</script>';
  }
  location /admin/ { proxy_pass http://taiga-back:8000/admin/; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Scheme $cloudif_scheme; proxy_set_header X-Forwarded-Proto $cloudif_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /static/ { alias /taiga/static/; }
  location /_protected/ { internal; alias /taiga/media/; add_header Content-disposition "attachment"; }
  location /media/exports/ { alias /taiga/media/exports/; add_header Content-disposition "attachment"; }
  location /media/ { proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Scheme $cloudif_scheme; proxy_set_header X-Forwarded-Proto $cloudif_scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_pass http://taiga-protected:8003/; }
  location /events { proxy_pass http://taiga-events:8888/events; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_connect_timeout 7d; proxy_send_timeout 7d; proxy_read_timeout 7d; }
}
